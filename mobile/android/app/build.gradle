plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.fallguard.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.fallguard.ai"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            def backendBaseUrl = project.findProperty("backendBaseUrl") ?: "http://10.0.2.2:8000"
            buildConfigField "String", "DEFAULT_BACKEND_BASE_URL", "\"${backendBaseUrl}\""
        }
        release {
            def backendBaseUrl = project.findProperty("backendBaseUrl")?.toString()?.trim() ?: ""
            if (backendBaseUrl && !backendBaseUrl.startsWith("https://")) {
                throw new GradleException("Release builds require backendBaseUrl=https://<your-deployed-backend>.")
            }
            buildConfigField "String", "DEFAULT_BACKEND_BASE_URL", "\"${backendBaseUrl}\""
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Coroutines & Lifecycle
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Persistent WebSocket & Networking (OkHttp)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON serialization (Gson)
    implementation 'com.google.code.gson:gson:2.10.1'

    // Optional GPS Location
    implementation 'com.google.android.gms:play-services-location:21.1.0'
}
